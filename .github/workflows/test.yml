name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter=@lightbird/core --filter=@lightbird/player-react --filter=@lightbird/player

      - name: Bundle size budget
        run: node scripts/check-core-bundle.js

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm turbo test --verbosity=2

      - name: Build web application
        run: pnpm --filter web build

      - name: Install browser for responsive checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Responsive browser checks
        run: |
          pnpm --filter web exec next start -p 9002 > /tmp/lightbird-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          pnpm test:responsive

      - name: Browser server logs
        if: failure()
        run: cat /tmp/lightbird-browser.log 2>/dev/null || true
