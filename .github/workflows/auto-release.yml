name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  release:
    if: "github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'chore: bump to v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from PR title
        id: version
        run: |
          VERSION=$(echo "${{ github.event.pull_request.title }}" | grep -oP 'v\d+\.\d+\.\d+')
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            Release ${{ steps.version.outputs.tag }}

            Published packages:
            - [@lightbird/core](https://www.npmjs.com/package/@lightbird/core)
            - [@lightbird/ui](https://www.npmjs.com/package/@lightbird/ui)
          generate_release_notes: true
